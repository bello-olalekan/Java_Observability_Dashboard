services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      API_UPSTREAM: http://app:8080
    ports:
      - "5173:8080"
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USERNAME: appuser
      DB_PASSWORD: appsecret
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"
