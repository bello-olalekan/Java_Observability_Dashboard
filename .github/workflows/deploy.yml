name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag
        required: true
        default: latest

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      FRONTEND_ECR_REPOSITORY_URL: ${{ vars.FRONTEND_ECR_REPOSITORY_URL }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      MEMCACHED_HOST: ${{ vars.MEMCACHED_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app image
        run: |
          docker build -f docker/Dockerfile -t "$ECR_REPOSITORY_URL:${{ inputs.image_tag }}" .
          docker push "$ECR_REPOSITORY_URL:${{ inputs.image_tag }}"
      - name: Build frontend image
        run: |
          docker build -f docker/frontend.Dockerfile -t "$FRONTEND_ECR_REPOSITORY_URL:${{ inputs.image_tag }}" .
          docker push "$FRONTEND_ECR_REPOSITORY_URL:${{ inputs.image_tag }}"
      - uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
      - name: Deploy Helm chart
        run: |
          helm upgrade --install java-api ./helm/java-api \
            --namespace java-api \
            --create-namespace \
            --set image.repository="$ECR_REPOSITORY_URL" \
            --set image.tag="${{ inputs.image_tag }}" \
            --set env.DB_HOST="$DB_HOST" \
            --set env.DB_NAME="$DB_NAME" \
            --set env.DB_USERNAME="$DB_USERNAME" \
            --set env.DB_PASSWORD="$DB_PASSWORD" \
            --set env.MEMCACHED_HOST="$MEMCACHED_HOST" \
            --set serviceMonitor.enabled=true
          helm upgrade --install frontend ./helm/frontend \
            --namespace java-api \
            --create-namespace \
            --set image.repository="$FRONTEND_ECR_REPOSITORY_URL" \
            --set image.tag="${{ inputs.image_tag }}"
