replicaCount: 2

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 8080

env:
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: appdb
  DB_USERNAME: appuser
  DB_PASSWORD: ""
  MEMCACHED_HOST: ""
  MEMCACHED_PORT: "11211"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
